# Full training on ALL available diff_amps + comparators with precomputed GNN features.
#
# This config enumerates circuit IDs by scanning for `comb_graph_gnn.npz`.
# If you add more circuits later, re-generate this list (or we can extend the training
# code to auto-discover).

data:
  batch_size: 32
  cache_graphs: false
  data_dir: /home/karthik/sim_clean/AMS-opt/netlists
  family_balance: equal
  pos_neg_ratio: 1.0
  shuffle: true

  # All circuits to consider (train+val); validation split is defined by `test_circuits` below.
  circuits:
    diff_amps:
      - 69
      - 71
      - 75
      - 77
      - 80
      - 82
      - 84
      - 86
      - 88
      - 90
      - 92
      - 94
      - 96
      - 97
      - 614
      - 615
      - 616
      - 617
      - 618
      - 619
      - 620
      - 621
      - 921
      - 922
      - 923
      - 924
      - 925
      - 926
      - 927
      - 928
      - 929
      - 930
      - 931
      - 932
    comparators:
      - 632
      - 633
      - 634
      - 635
      - 738
      - 740
      - 741
      - 742
      - 746
      - 747
      - 748
      - 749
      - 1045
      - 1046
      - 1047
      - 1048
      - 1049
      - 1050
      - 1051
      - 1053
      - 1054
      - 1055
      - 1056
      - 1057
      - 1058
      - 1059
      - 1060
      - 1062
      - 1063
      - 1065
      - 1071
      - 1073

  # Hold-out circuits for validation.
  # Notes:
  # - Training code treats these as the validation set (it calls them test_circuits).
  # - Keep at least 1 per family if you want validation to run.
  test_circuits:
    diff_amps:
      - 94
      - 97
    comparators:
      - 1073

early_stopping:
  min_delta: 0.0001
  patience: 10

logging:
  log_level: INFO
  tensorboard_dir: ./logs_full_training
  verbose: true

loss:
  hard_neg_weight: 1.0
  temperature: 0.07
  type: nt_xent
  nt_xent_weight: 0.9
  consistency:
    enabled: true
    type: margin
    weight: 0.1
    margin: 0.7
    max_dist: 1.0
    temperature: 1.0

model:
  dropout: 0.1
  embedding_dim: 128
  hidden_dims:
    - 64
    - 64
    - 32
  # Must match `comb_graph_gnn_meta.json` -> feature_dim (after SUBCAT_SLOTS=6 and global meanings)
  input_dim: 79
  projection_dim: 128
  use_batch_norm: true

optimizer:
  betas:
    - 0.9
    - 0.999
  lr: 0.001
  type: adam
  weight_decay: 1.0e-05

scheduler:
  type: cosine

training:
  checkpoint_dir: ./checkpoints_full_training
  device: cpu
  epochs: 20
  log_interval: 2
  seed: 42
  val_interval: 2
